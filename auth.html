<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ludo Plus - Login / Register</title>
    <!-- Google Fonts for Premium Look -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        /* Auth Specific Styles (Merged with main theme) */
        .auth-wrapper {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .auth-box {
            background-color: var(--bg-secondary);
            width: 100%;
            max-width: 400px;
            border-radius: var(--border-radius-lg);
            padding: 30px 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            border: 1px solid var(--bg-tertiary);
        }
        .auth-tabs {
            display: flex;
            margin-bottom: 25px;
            background-color: var(--bg-primary);
            border-radius: var(--border-radius-md);
            overflow: hidden;
            border: 1px solid var(--bg-tertiary);
        }
        .auth-tab {
            flex: 1;
            padding: 12px;
            text-align: center;
            font-weight: 700;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.3s;
        }
        .auth-tab.active {
            background-color: var(--ludo-blue);
            color: white;
        }
        .input-group {
            margin-bottom: 15px;
        }
        .input-group label {
            display: block;
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 5px;
            font-weight: 600;
        }
        .auth-input {
            width: 100%;
            padding: 14px 15px;
            background-color: var(--bg-primary);
            border: 1px solid var(--bg-tertiary);
            color: var(--text-main);
            border-radius: var(--border-radius-sm);
            font-size: 15px;
            outline: none;
            transition: border 0.3s;
        }
        .auth-input:focus {
            border-color: var(--ludo-blue);
        }
        .auth-btn {
            width: 100%;
            margin-top: 10px;
            padding: 15px;
            font-size: 16px;
            border-radius: var(--border-radius-md);
            justify-content: center;
        }
        .auth-logo {
            margin-bottom: 30px;
        }
        .full-screen-loader {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(15, 23, 42, 0.9);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>

    <!-- Loading Overlay (Hidden by default) -->
    <div id="auth-loader" class="full-screen-loader hidden">
        <div class="loading-spinner"></div>
        <p id="loader-text" style="font-weight: 600; margin-top: 10px;">Please wait...</p>
    </div>

    <!-- Main Auth Container -->
    <div id="app-container" class="auth-wrapper">
        
        <!-- Logo -->
        <div class="logo-container auth-logo">
            <h1 class="logo-text" style="font-size: 42px;">LUDO <span>PLUS</span></h1>
            <p style="color: var(--text-muted); font-size: 14px;">Play Online & Win Real Coins</p>
        </div>

        <!-- Auth Box -->
        <div class="auth-box">
            
            <!-- Tabs -->
            <div class="auth-tabs">
                <div class="auth-tab active" id="tab-login">LOGIN</div>
                <div class="auth-tab" id="tab-register">REGISTER</div>
            </div>

            <!-- LOGIN FORM -->
            <form id="login-form" autocomplete="off">
                <div class="input-group">
                    <label>EMAIL ADDRESS</label>
                    <input type="email" id="login-email" class="auth-input" placeholder="Enter your email" required>
                </div>
                <div class="input-group">
                    <label>PASSWORD</label>
                    <input type="password" id="login-password" class="auth-input" placeholder="Enter your password" required>
                </div>
                <button type="submit" class="action-btn primary-btn auth-btn">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width: 20px; height: 20px; margin-right: 8px;"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path><polyline points="10 17 15 12 10 7"></polyline><line x1="15" y1="12" x2="3" y2="12"></line></svg>
                    LOGIN NOW
                </button>
            </form>

            <!-- REGISTER FORM (Hidden by default) -->
            <form id="register-form" class="hidden" autocomplete="off">
                <div class="input-group">
                    <label>USERNAME</label>
                    <input type="text" id="reg-username" class="auth-input" placeholder="Enter username" required minlength="3" maxlength="15">
                </div>
                <div class="input-group">
                    <label>EMAIL ADDRESS</label>
                    <input type="email" id="reg-email" class="auth-input" placeholder="Enter email address" required>
                </div>
                <div class="input-group">
                    <label>PASSWORD</label>
                    <input type="password" id="reg-password" class="auth-input" placeholder="Create a password" required minlength="6">
                </div>
                <div class="input-group">
                    <label>CONFIRM PASSWORD</label>
                    <input type="password" id="reg-confirm-password" class="auth-input" placeholder="Confirm your password" required minlength="6">
                </div>
                <button type="submit" class="action-btn primary-btn auth-btn" style="background: linear-gradient(135deg, var(--ludo-green), #059669); box-shadow: 0 8px 20px rgba(16, 185, 129, 0.4);">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width: 20px; height: 20px; margin-right: 8px;"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="8.5" cy="7" r="4"></circle><line x1="20" y1="8" x2="20" y2="14"></line><line x1="23" y1="11" x2="17" y2="11"></line></svg>
                    CREATE ACCOUNT
                </button>
            </form>

            <!-- Error/Success Message Area -->
            <p id="auth-error-msg" class="error-text hidden mt-10"></p>

        </div>
    </div>

    <!-- Notification Toast -->
    <div id="notification-toast" class="toast hidden">
        <span id="toast-message">Notification</span>
    </div>

    <!-- Core Scripts (Modular Firebase used via JS) -->
    <script type="module" src="firebase-config.js"></script>
    <script type="module" src="auth.js"></script>
</body>
</html>
