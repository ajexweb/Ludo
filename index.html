<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ludo Plus - Play Online & Win</title>
    <!-- Google Fonts for Premium Look -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Splash / Loading Screen -->
    <div id="splash-screen" class="active">
        <div class="logo-container">
            <h1 class="logo-text">LUDO <span>PLUS</span></h1>
            <div class="loading-spinner"></div>
            <p>Loading your game...</p>
        </div>
    </div>

    <!-- Main Application Container -->
    <div id="app-container" class="hidden">
        
        <!-- Header area -->
        <header class="top-header">
            <div class="brand">
                <h2>LUDO PLUS</h2>
            </div>
            <div class="wallet-badge" id="header-wallet-btn" onclick="window.location.href='wallet.html'">
                <!-- Coin SVG -->
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10" fill="#FFD700" stroke="#B8860B"/><text x="12" y="16" font-size="12" font-weight="bold" fill="#B8860B" text-anchor="middle">₹</text></svg>
                <span id="user-balance">0</span>
                <div class="add-icon">+</div>
            </div>
        </header>

        <!-- Player Profile Snippet -->
        <section class="player-card">
            <div class="player-avatar">
                <!-- User SVG -->
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
            </div>
            <div class="player-info">
                <h3 id="user-name">Loading...</h3>
                <p class="player-id">ID: <span id="user-player-id">LP-----</span></p>
            </div>
        </section>

        <!-- Main Action Buttons -->
        <main class="game-modes">
            <!-- Play Online -->
            <button class="action-btn primary-btn" id="btn-play-online">
                <div class="btn-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><polygon points="10 8 16 12 10 16 10 8"></polygon></svg>
                </div>
                <div class="btn-text">
                    <h4>PLAY ONLINE</h4>
                    <p>Global Matchmaking</p>
                </div>
            </button>

            <!-- Create Room -->
            <button class="action-btn secondary-btn" id="btn-create-room">
                <div class="btn-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
                </div>
                <div class="btn-text">
                    <h4>CREATE ROOM</h4>
                    <p>Play with friends</p>
                </div>
            </button>

            <!-- Join Room -->
            <button class="action-btn secondary-btn" id="btn-join-room">
                <div class="btn-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path><polyline points="10 17 15 12 10 7"></polyline><line x1="15" y1="12" x2="3" y2="12"></line></svg>
                </div>
                <div class="btn-text">
                    <h4>JOIN ROOM</h4>
                    <p>Enter Room ID</p>
                </div>
            </button>
        </main>

        <!-- Bottom Navigation -->
        <nav class="bottom-nav">
            <a href="index.html" class="nav-item active">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
                <span>Home</span>
            </a>
            <a href="wallet.html" class="nav-item">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="5" width="20" height="14" rx="2"></rect><line x1="2" y1="10" x2="22" y2="10"></line></svg>
                <span>Wallet</span>
            </a>
            <a href="#" class="nav-item" id="nav-profile">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
                <span>Settings</span>
            </a>
        </nav>
    </div>

    <!-- Modals (Hidden by default, controlled via JS) -->

    <!-- Choose Match Size Modal -->
    <div id="modal-choose-match" class="modal-overlay hidden">
        <div class="modal-box">
            <div class="modal-header">
                <h3>Select Players</h3>
                <button class="close-btn" onclick="closeModal('modal-choose-match')">
                    <svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </button>
            </div>
            <div class="modal-body">
                <p class="fee-info">Entry Fee: <strong>50 Coins</strong> | Win: <strong>80 Coins</strong></p>
                <button class="match-size-btn" data-players="2">
                    <span>2 PLAYERS</span>
                    <small>1 vs 1</small>
                </button>
                <button class="match-size-btn" data-players="4">
                    <span>4 PLAYERS</span>
                    <small>4 Player Battle</small>
                </button>
            </div>
        </div>
    </div>

    <!-- Matchmaking Searching Modal -->
    <div id="modal-searching" class="modal-overlay hidden">
        <div class="modal-box text-center">
            <div class="radar-spinner"></div>
            <h3 id="search-status-text">Searching for Players...</h3>
            <p id="search-timer">00:00</p>
            <button class="cancel-btn" id="btn-cancel-search">Cancel</button>
        </div>
    </div>

    <!-- Join Room Modal -->
    <div id="modal-join-room" class="modal-overlay hidden">
        <div class="modal-box">
            <div class="modal-header">
                <h3>Join Room</h3>
                <button class="close-btn" onclick="closeModal('modal-join-room')">
                    <svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </button>
            </div>
            <div class="modal-body">
                <input type="text" id="join-room-id" class="input-field" placeholder="Enter Room ID (e.g. LP7K42)" maxlength="10" autocomplete="off">
                <button class="primary-btn mt-10" id="btn-submit-join">JOIN NOW</button>
                <p id="join-error-msg" class="error-text hidden"></p>
            </div>
        </div>
    </div>

    <!-- Settings / Profile Modal -->
    <div id="modal-settings" class="modal-overlay hidden">
        <div class="modal-box">
            <div class="modal-header">
                <h3>Profile & Settings</h3>
                <button class="close-btn" onclick="closeModal('modal-settings')">
                    <svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </button>
            </div>
            <div class="modal-body stats-grid">
                <div class="stat-box">
                    <span class="stat-label">Total Matches</span>
                    <strong id="stat-matches">0</strong>
                </div>
                <div class="stat-box">
                    <span class="stat-label">Wins</span>
                    <strong id="stat-wins" class="text-green">0</strong>
                </div>
                <div class="stat-box">
                    <span class="stat-label">Losses</span>
                    <strong id="stat-losses" class="text-red">0</strong>
                </div>
            </div>
            <div class="modal-footer">
                <button class="logout-btn" id="btn-logout">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
                    LOGOUT
                </button>
            </div>
        </div>
    </div>

    <!-- Notification Toast -->
    <div id="notification-toast" class="toast hidden">
        <span id="toast-message">Notification here</span>
    </div>

    <!-- Core Scripts (Modular Firebase used via JS) -->
    <script type="module" src="firebase-config.js"></script>
    <script type="module" src="script.js"></script>
</body>
</html>
